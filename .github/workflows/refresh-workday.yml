name: Refresh Workday MNC jobs

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest jobs from tracked Workday tenants
        run: node scripts/fetch-workday.mjs

      - name: Commit updated jobs file
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs-workday.json
          git diff --quiet --cached || git commit -m "chore: refresh Workday MNC jobs [skip ci]"
          git push
